name: Build and push Portal image

on:
  workflow_dispatch:
    inputs:
      environment:
        description: staging or production
        required: true
        type: choice
        options:
          - production
          - staging
  push:
    tags:
      - 'portal-v*'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: |
          short="${GITHUB_SHA::12}"
          echo "tag=sha-${short}" >> "$GITHUB_OUTPUT"
          echo "### portal image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/trucksoft-portal:sha-${short}\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/trucksoft-portal:${{ steps.tags.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
